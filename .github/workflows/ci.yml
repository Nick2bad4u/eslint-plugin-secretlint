name: "Continuous Integration"

run-name: "Continuous Integration - ${{ github.ref_name }} @${{ github.actor }}"

concurrency:
    group: "ci-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

on:
    push:
        branches:
            - "main"
    pull_request:
    merge_group:
        types:
            - "checks_requested"

permissions:
    contents: "read"

jobs:
    test:
        name: "Test (${{ matrix.label }})"
        runs-on: "${{ matrix.os }}"
        timeout-minutes: 60
        permissions:
            contents: "read"
            id-token: "write"
        strategy:
            fail-fast: true
            matrix:
                include:
                    - label: "linux"
                      os: "ubuntu-latest"
                      codecov_flag: "os-linux"
                    - label: "windows"
                      os: "windows-latest"
                      codecov_flag: "os-windows"
                    - label: "macos"
                      os: "macos-latest"
                      codecov_flag: "os-macos"
        defaults:
            run:
                shell: "bash"
        env:
            CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              if: "${{ matrix.os == 'ubuntu-latest' }}"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0

            - name: "Setup Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false

            - name: "Install pinned npm"
              run: |
                  npm_package_manager=$(node -p "require('./package.json').packageManager")
                  (cd "${RUNNER_TEMP}" && npm install --global --ignore-scripts "${npm_package_manager}")
                  expected_npm_version="${npm_package_manager#npm@}"
                  actual_npm_version=$(npm --version)
                  test "${actual_npm_version}" = "${expected_npm_version}"

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Build package"
              run: "npm run build"

            - name: "Verify generated docs tables"
              run: |
                  npm run sync:readme-rules-table
                  npm run sync:presets-rules-matrix

            - name: "Typecheck"
              run: "npm run typecheck"

            - name: "Run tests with coverage and JUnit report"
              run: "npx vitest run --coverage --reporter=github-actions --reporter=dot --reporter=junit --outputFile=test-report.junit.xml --silent"
              env:
                  CI: "true"
                  MAX_THREADS: "1"
                  VITEST_HANGING_PROCESS_REPORTER: "true"

            - name: "Verify coverage artifact"
              run: >-
                  python -c "from pathlib import Path; assert Path('coverage/lcov.info').is_file(), 'coverage/lcov.info was not generated'"

            - name: "Verify JUnit artifact"
              run: >-
                  python -c "from pathlib import Path; assert Path('test-report.junit.xml').is_file(), 'test-report.junit.xml was not generated'"

            - name: "Upload test results to Codecov"
              if: "${{ !cancelled() && env.CODECOV_TOKEN != '' }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  slug: "${{ github.repository }}"
                  files: "test-report.junit.xml"
                  flags: "${{ matrix.codecov_flag }}"
                  name: "vitest-junit-${{ matrix.codecov_flag }}"
                  report_type: "test_results"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true

            - name: "Upload coverage to Codecov"
              if: "${{ !cancelled() && env.CODECOV_TOKEN != '' }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  slug: "${{ github.repository }}"
                  files: "./coverage/lcov.info"
                  flags: "${{ matrix.codecov_flag }}"
                  name: "vitest-unit-coverage-${{ matrix.codecov_flag }}"
                  report_type: "coverage"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true

    eslint9-compat:
        name: "ESLint 9 Compatibility (${{ matrix.label }})"
        runs-on: "ubuntu-latest"
        timeout-minutes: 20
        permissions:
            contents: "read"
        strategy:
            fail-fast: true
            matrix:
                include:
                    - eslint-js-version: "9.0.0"
                      eslint-version: "9.0.0"
                      label: "9.0.0"
                    - eslint-js-version: "^9.39.1"
                      eslint-version: "^9.39.1"
                      label: "9.latest"
        defaults:
            run:
                shell: "bash"

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0

            - name: "Setup Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false

            - name: "Install pinned npm"
              run: |
                  npm_package_manager=$(node -p "require('./package.json').packageManager")
                  (cd "${RUNNER_TEMP}" && npm install --global --ignore-scripts "${npm_package_manager}")
                  expected_npm_version="${npm_package_manager#npm@}"
                  actual_npm_version=$(npm --version)
                  test "${actual_npm_version}" = "${expected_npm_version}"

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Build package"
              run: "npm run build"

            - name: "Run ESLint 9 consumer compatibility smoke checks"
              run: |
                  package_name=$(node -p "require('./package.json').name")
                  secretlint_version=$(node -p "require('./package.json').dependencies.secretlint")
                  pack_metadata_path="${RUNNER_TEMP}/npm-pack.json"
                  npm pack --ignore-scripts --json --pack-destination "${RUNNER_TEMP}" > "${pack_metadata_path}"
                  tarball_filename=$(node scripts/read-npm-pack-filename.mjs "${pack_metadata_path}" "${package_name}")
                  consumer_dir="${RUNNER_TEMP}/eslint9-consumer"
                  mkdir -p "${consumer_dir}"
                  cd "${consumer_dir}"
                  npm init --yes >/dev/null
                  npm install --ignore-scripts --no-save \
                    "eslint@${{ matrix.eslint-version }}" \
                    "@eslint/js@${{ matrix.eslint-js-version }}" \
                    "@secretlint/secretlint-rule-pattern@${secretlint_version}" \
                    "${RUNNER_TEMP}/${tarball_filename}"
                  node "${GITHUB_WORKSPACE}/scripts/eslint9-compat-smoke.mjs" --expect-eslint-major=9
